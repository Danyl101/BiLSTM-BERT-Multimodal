version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  simple:
    format: "%(levelname)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  Bert_Cleaner:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Bert_Cleaner.log
    encoding: utf8
    mode: w

  Bert_Label:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Bert_Label.log
    encoding: utf8
    mode : w

  Bert_Label_Balancing:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Bert_Label_Balancing.log
    encoding: utf8
    mode : w

  Bert_Label_Checker:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Bert_Label_Checker.log
    encoding: utf8
    mode : w

  Bert_Datasplit:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Bert_Datasplit.log
    encoding: utf8
    mode : w

  Compare:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Compare.log
    encoding: utf8
    mode : w

  Flask:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Flask.log
    encoding: utf8
    mode : w
  
  Extract:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Extract.log
    encoding: utf8
    mode : w

  Optuna:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Optuna.log
    encoding: utf8
    mode : w
  
  Scraper:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: Logs/Scraper.log
    encoding: utf8
    mode : w

loggers:
  Bert_Cleaner:
    level: DEBUG
    handlers: [console, Bert_Cleaner]
    propagate: no

  Bert_Label:
    level: DEBUG
    handlers: [console, Bert_Label]
    propagate: no

  Bert_Label_Balancing:
    level: DEBUG
    handlers: [console, Bert_Label_Balancing]
    propagate: no

  Bert_Label_Checker:
    level: DEBUG
    handlers: [console, Bert_Label_Checker]
    propagate: no

  Bert_Datasplit:
    level: DEBUG
    handlers: [console, Bert_Datasplit]
    propagate: no

  Compare:
    level: DEBUG
    handlers: [console, Compare]
    propagate: no

  Flask:
    level: DEBUG
    handlers: [console, Flask]
    propagate: no

  Extract:
    level: DEBUG
    handlers: [console, Extract]
    propagate: no

  Optuna:
    level: DEBUG
    handlers: [console, Optuna]
    propagate: no

  Scraper:
    level: DEBUG
    handlers: [console, Scraper]
    propagate: no

root:
  level: WARNING
  handlers: [console]